# HR portál v Dockeri (localhost:5174): statické súbory + proxy na oba backendy.
# Názvy backend-1 / backend-2 sú názvy služieb v docker-compose.yml.
# Portál uchádzača má rovnaký súbor nginx.candidate.conf, líši sa len hodnotou „candidate“ / „hr“.

# Session cookie tohto portálu (Backend 1 ju vydá podľa X-Client-App).
# Backend 2 ju preposiela do Backendu 1 pod starým menom hr.sid, preto ju pri /api/ml premenujeme.
map $http_cookie $portal_sid {
    "~(?:^|;)\s*sr\.hr\.sid=([^;]+)" $1;
    default "";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 6m;

    # DNS Dockeru – adresy backendov sa zisťujú až pri požiadavke,
    # takže nginx naštartuje, aj keď backend ešte nebeží.
    resolver 127.0.0.11 valid=10s;
    set $backend1 http://backend-1:3001;
    set $backend2 http://backend-2:8000;

    # X-Client-App určí v Backende 1 portál (cookie, povolené roly); hodnotu z prehliadača prepíše.
    location /api/ml/ {
        proxy_pass $backend2;
        proxy_set_header X-Client-App hr;
        proxy_set_header Cookie "hr.sid=$portal_sid";
    }
    location /api/ {
        proxy_pass $backend1;
        proxy_set_header Host $host;
        proxy_set_header X-Client-App hr;
        proxy_read_timeout 100s;
    }

    # PDF.js uses an ES module worker served locally with the application.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    # React Router – všetky ostatné cesty vrátia index.html
    location / { try_files $uri /index.html; }
}
